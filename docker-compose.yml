services:
  db:
    image: postgres:17.6
    environment:
      POSTGRES_USER: fernleaf
      POSTGRES_PASSWORD: fernleaf
      POSTGRES_DB: ${COMPOSE_DB_NAME:-fernleaf_a}
    ports:
      - "${COMPOSE_DB_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fernleaf -d ${COMPOSE_DB_NAME:-fernleaf_a}"]
      interval: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
