services:
  db:
    image: postgres:17.6
    environment:
      POSTGRES_USER: fernleaf
      POSTGRES_PASSWORD: fernleaf
      POSTGRES_DB: fernleaf_a
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fernleaf -d fernleaf_a"]
      interval: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
